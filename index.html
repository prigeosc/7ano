<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geografia do Brasil — Território, População e Economia — 7º ano</title>
<meta name="description" content="Apresentação interativa de Geografia sobre globalização, economia e transformações do espaço mundial — Anos Finais do Ensino Fundamental.">
<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */
:root{
  --ink:        #10263f;
  --ink-soft:   #1c3a5c;
  --paper:      #eef1ec;
  --paper-2:    #ffffff;
  --line:       #d6dbd2;
  --gold:       #b8863b;
  --gold-light: #e4c893;
  --teal:       #2f6f6b;
  --teal-light: #d9e8e6;
  --danger:     #b5473f;
  --danger-bg:  #f7e6e3;
  --success:    #3f7d5c;
  --success-bg: #e4efe6;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'Courier New', Consolas, monospace;

  --radius-s: 6px;
  --radius-m: 12px;
  --radius-l: 20px;
  --shadow-card: 0 2px 14px rgba(16,38,63,0.08);
  --shadow-pop: 0 12px 32px rgba(16,38,63,0.18);

  --sidebar-w: 300px;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
button{ font-family:inherit; }
a{ color:inherit; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* Visible focus states for accessibility */
a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

/* ==========================================================================
   APP SHELL
   ========================================================================== */
.app{
  display:flex;
  min-height:100vh;
}

/* ---------- Sidebar ---------- */
.sidebar{
  width: var(--sidebar-w);
  flex-shrink:0;
  background: var(--ink);
  color: #eef1ec;
  display:flex;
  flex-direction:column;
  position: fixed;
  top:0; left:0; bottom:0;
  overflow-y:auto;
  z-index: 40;
  transition: transform .28s ease;
}
.sidebar::-webkit-scrollbar{ width:8px; }
.sidebar::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius:4px; }

.brand{
  padding: 26px 22px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
.brand__compass{ width:40px; height:40px; margin-bottom:10px; }
.brand__title{
  font-family: var(--font-display);
  font-size: 1.28rem;
  line-height:1.25;
  margin:0 0 4px;
  color:#fff;
}
.brand__subtitle{
  font-size:0.78rem;
  letter-spacing:.03em;
  color: var(--gold-light);
  text-transform: uppercase;
  margin:0;
}

.toc{
  padding: 10px 10px 24px;
  list-style:none;
  margin:0;
}
.toc__group-label{
  font-size:0.68rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color: rgba(238,241,236,0.45);
  padding: 16px 12px 6px;
}
.toc__item{ margin:1px 0; }
.toc__link{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius: var(--radius-s);
  text-decoration:none;
  color: rgba(238,241,236,0.82);
  font-size:0.86rem;
  cursor:pointer;
  border:none;
  background:none;
  width:100%;
  text-align:left;
}
.toc__link:hover{ background: rgba(255,255,255,0.07); color:#fff; }
.toc__link.is-active{
  background: rgba(184,134,59,0.22);
  color:#fff;
  font-weight:600;
}
.toc__num{
  flex-shrink:0;
  width:22px; height:22px;
  border-radius:50%;
  border:1px solid rgba(238,241,236,0.35);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono);
  font-size:0.68rem;
}
.toc__link.is-active .toc__num{
  background: var(--gold);
  border-color: var(--gold);
  color: var(--ink);
}
.toc__link.is-done .toc__num{ background: rgba(63,125,92,0.6); border-color: transparent; }

.sidebar__close{
  display:none;
  position:absolute; top:16px; right:16px;
  background:none; border:none; color:#fff;
  font-size:1.4rem; cursor:pointer;
  width:36px; height:36px;
}

/* ---------- Main content ---------- */
.main{
  margin-left: var(--sidebar-w);
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  position: sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding: 12px 28px;
  background: rgba(238,241,236,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.topbar__menu{
  display:none;
  background:none; border:1px solid var(--line); border-radius:var(--radius-s);
  width:38px; height:38px; cursor:pointer; color:var(--ink); font-size:1.1rem;
}
.progress{
  flex:1;
  height:6px;
  background: var(--line);
  border-radius:4px;
  overflow:hidden;
}
.progress__bar{
  height:100%;
  background: linear-gradient(90deg, var(--teal), var(--gold));
  width:0%;
  transition: width .4s ease;
}
.progress__label{
  font-family: var(--font-mono);
  font-size:0.74rem;
  color: var(--ink-soft);
  white-space:nowrap;
}

.view{
  flex:1;
  padding: 0 0 80px;
}

/* ==========================================================================
   HERO / CHAPTER HEADER
   ========================================================================== */
.hero{
  position:relative;
  background: linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 60%, #234a72 100%);
  color:#fff;
  padding: 56px 48px 46px;
  overflow:hidden;
  display:flex;
  align-items:center;
  gap:36px;
  justify-content:space-between;
}
.hero::after{
  content:"";
  position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 85% 20%, rgba(228,200,147,0.14), transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(47,111,107,0.25), transparent 40%);
  pointer-events:none;
}
.hero__inner{ position:relative; max-width:640px; flex:1; }
.hero__kicker{
  display:inline-flex; align-items:center; gap:8px;
  font-family: var(--font-mono);
  font-size:0.78rem; letter-spacing:.08em; text-transform:uppercase;
  color: var(--gold-light);
  margin-bottom: 14px;
}
.hero__kicker .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); display:inline-block; }
.hero__title{
  font-family: var(--font-display);
  font-size: clamp(1.7rem, 3.4vw, 2.6rem);
  line-height:1.15;
  margin:0 0 16px;
}
.hero__lead{
  font-size:1.02rem;
  line-height:1.65;
  color: rgba(255,255,255,0.86);
  max-width:70ch;
  margin:0;
}
.hero__capa{
  position:relative;
  flex-shrink:0;
  width:230px;
  height:150px;
}
@media (max-width:900px){ .hero__capa{ display:none; } }

/* ---------- Slot de imagem editável ---------- */
.img-slot{
  position:relative;
  width:100%; height:100%;
  border-radius: var(--radius-m);
  overflow:hidden;
  background: rgba(255,255,255,0.06);
}
.img-slot img{
  width:100%; height:100%;
  object-fit:cover;
  position:relative; z-index:2;
}
.img-slot__placeholder{
  position:absolute; inset:0;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:4px;
  padding:14px;
  border: 1.5px dashed rgba(228,200,147,0.55);
  border-radius: var(--radius-m);
  color: var(--gold-light);
  background: rgba(255,255,255,0.04);
}
.img-slot__placeholder svg{ width:30px; height:30px; opacity:0.85; margin-bottom:2px; }
.img-slot__label{
  font-family: var(--font-display);
  font-size:0.86rem;
  color:#fff;
  margin:0;
}
.img-slot__hint{
  font-family: var(--font-mono);
  font-size:0.64rem;
  color: rgba(255,255,255,0.55);
  margin:0;
  line-height:1.4;
  word-break: break-word;
}
.img-slot__hint code{
  color: var(--gold-light);
  background: rgba(0,0,0,0.25);
  padding:1px 4px;
  border-radius:3px;
}
.img-slot--loaded .img-slot__placeholder{ display:none; }
.img-slot--empty img{ display:none; }

/* Variante clara, usada fora do hero escuro (ex.: mapa mental) */
.img-slot--map{
  height: 440px;
  background: var(--paper);
}
.img-slot--map img{
  object-fit: contain;   /* mostra a imagem inteira, sem cortar nem esticar */
  cursor: zoom-in;
}
.img-slot--map .img-slot__placeholder{
  border-color: var(--line);
  background: var(--paper);
  color: var(--teal);
}
.img-slot--map .img-slot__label{ color: var(--ink); }
.img-slot--map .img-slot__hint{ color:#5a6b7a; }
.img-slot--map .img-slot__hint code{ color: var(--ink); background: var(--line); }
.img-slot--map.img-slot--loaded::after{
  content:"🔍 Toque na imagem para ampliar";
  position:absolute;
  bottom:10px; right:12px;
  z-index:3;
  background: rgba(16,38,63,0.78);
  color:#fff;
  font-family: var(--font-mono);
  font-size:0.68rem;
  padding:5px 11px;
  border-radius:20px;
  pointer-events:none;
}
@media (max-width:560px){
  .img-slot--map{ height:300px; }
}

/* ==========================================================================
   LIGHTBOX — visualização ampliada da imagem do mapa mental
   ========================================================================== */
.lightbox{
  display:none;
  position:fixed; inset:0;
  z-index:200;
  background: rgba(8,16,26,0.94);
  align-items:center;
  justify-content:center;
  padding: 30px;
}
.lightbox.is-visible{ display:flex; }
.lightbox__close{
  position:absolute;
  top:18px; right:20px;
  width:44px; height:44px;
  border-radius:50%;
  background: rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.35);
  color:#fff;
  font-size:1.15rem;
  cursor:pointer;
  z-index:2;
}
.lightbox__close:hover{ background: rgba(255,255,255,0.22); }
.lightbox__hint{
  position:absolute;
  bottom:16px; left:0; right:0;
  text-align:center;
  color: rgba(255,255,255,0.65);
  font-family: var(--font-mono);
  font-size:0.72rem;
  pointer-events:none;
}
.lightbox__scroll{
  max-width:100%;
  max-height:100%;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
}
/* Quando ampliada, a centralização por flexbox impede rolar para a
   esquerda/cima (limitação conhecida do CSS). Por isso, no modo ampliado,
   trocamos para um layout em bloco, onde a rolagem funciona nos 4 sentidos. */
.lightbox__scroll.is-zoomed{
  display:block;
  text-align:left;
}
.lightbox__img{
  max-width:88vw;
  max-height:82vh;
  object-fit:contain;
  cursor:zoom-in;
  border-radius:6px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.lightbox__img.is-zoomed{
  display:block;
  max-width:none;
  max-height:none;
  width:auto;
  height:auto;
  margin:0;
  cursor:zoom-out;
}


/* ==========================================================================
   PRIGEOSC — CAIXA DE NOTÍCIAS
   ========================================================================== */
.prigeosc-box{
  display:flex;
  gap:16px;
  align-items:flex-start;
  background: linear-gradient(135deg, #16324f, #1c3a5c);
  border-radius: var(--radius-l);
  padding: 18px 22px;
  margin-bottom: 30px;
  box-shadow: var(--shadow-card);
}
.prigeosc-box__avatar{
  flex-shrink:0;
  width:64px; height:64px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid var(--gold);
  box-shadow: 0 0 0 4px rgba(184,134,59,0.18);
}
.prigeosc-box__avatar img{ width:100%; height:100%; object-fit:cover; object-position: 50% 20%; }
.prigeosc-box__bubble{ flex:1; padding-top:2px; }
.prigeosc-box__name{
  font-family: var(--font-mono);
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:.06em;
  color: var(--gold-light);
  margin:0 0 6px;
}
.prigeosc-box__date{ color: rgba(238,241,236,0.55); text-transform:none; letter-spacing:0; }
.prigeosc-box__text{
  color:#fff;
  font-size:0.94rem;
  line-height:1.6;
  margin:0;
}

/* ---------- Guia na página de abertura ---------- */
.titlepage__guide{
  display:flex;
  align-items:center;
  gap:16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(228,200,147,0.3);
  border-radius: var(--radius-l);
  padding: 14px 20px;
  margin: 0 0 26px;
  text-align:left;
}
.titlepage__guide img{
  width:64px; height:64px;
  border-radius:50%;
  object-fit:cover;
  object-position: 50% 20%;
  border: 2px solid var(--gold);
  flex-shrink:0;
}
.titlepage__guide-text{
  font-size:0.92rem;
  line-height:1.5;
  color: rgba(255,255,255,0.9);
  margin:0;
}

/* ==========================================================================
   CAIXA DE INFORMAÇÕES EXTRAS
   ========================================================================== */
.extra-box{
  background: linear-gradient(135deg, #f4e6c8, #ecd9a8);
  border: 1px solid var(--gold);
  border-radius: var(--radius-l);
  padding: 18px 22px;
  margin: 6px 0 34px;
}
.extra-box__title{
  font-family: var(--font-display);
  font-size:1.02rem;
  color: var(--ink);
  margin:0 0 6px;
}
.extra-box__text{
  font-size:0.9rem;
  line-height:1.6;
  color:#4a3c22;
  margin:0;
}

/* ==========================================================================
   CONTENT SECTIONS
   ========================================================================== */
.content{
  max-width: 900px;
  padding: 40px 48px 0;
}
.section-block{
  margin-bottom: 34px;
}
.section-block__heading{
  font-family: var(--font-display);
  font-size:1.28rem;
  color: var(--ink);
  margin: 0 0 10px;
  padding-left: 16px;
  border-left: 4px solid var(--gold);
}
.section-block__body{
  font-size:0.98rem;
  line-height:1.7;
  color:#2a3f52;
  margin: 0 0 14px;
}
.card-list{
  list-style:none;
  margin:0; padding:0;
  display:grid;
  gap:10px;
}
.card-list li{
  background: var(--paper-2);
  border:1px solid var(--line);
  border-left: 3px solid var(--teal);
  border-radius: var(--radius-s);
  padding: 12px 16px;
  font-size:0.92rem;
  line-height:1.55;
  box-shadow: var(--shadow-card);
}

/* ==========================================================================
   MAPA MENTAL (agora como imagem — o professor insere a própria imagem)
   ========================================================================== */
.mindmap-wrap{
  max-width:900px;
  margin: 0 48px 46px;
  background: var(--paper-2);
  border:1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 26px 26px 30px;
  box-shadow: var(--shadow-card);
}
.mindmap-wrap__title{
  font-family: var(--font-mono);
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:.1em;
  color: var(--teal);
  margin: 0 0 4px;
}
.mindmap-wrap__hint{
  font-size:0.82rem;
  color:#5a6b7a;
  margin:0 0 18px;
}

/* ==========================================================================
   QUIZ — fechado por padrão (usa <details>/<summary> nativos)
   ========================================================================== */
.quiz-wrap{
  max-width:900px;
  margin: 0 48px 50px;
  background: var(--paper-2);
  border:1px solid var(--line);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-card);
  overflow:hidden;
}
.quiz-wrap__summary{
  list-style:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding: 20px 26px;
  background: var(--ink);
  color:#fff;
}
.quiz-wrap__summary::-webkit-details-marker{ display:none; }
.quiz-wrap__summary::marker{ content:""; }
.quiz-wrap__summary::after{
  content:"+";
  font-family: var(--font-mono);
  font-size:1.3rem;
  color: var(--gold-light);
  flex-shrink:0;
  transition: transform .2s ease;
}
.quiz-wrap[open] .quiz-wrap__summary::after{ content:"–"; }
.quiz-wrap__summary-title{
  font-family: var(--font-display);
  font-size:1.08rem;
}
.quiz-wrap__summary-hint{
  font-family: var(--font-mono);
  font-size:0.72rem;
  color: rgba(255,255,255,0.55);
  text-transform:uppercase;
  letter-spacing:.04em;
  display:block;
  margin-top:3px;
}
.quiz-wrap__body{
  padding: 24px 26px 26px;
}

.quiz{
  background: var(--paper-2);
  border:1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 20px 22px 22px;
  margin-bottom:16px;
  box-shadow: var(--shadow-card);
}
.quiz__type{
  font-family: var(--font-mono);
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  color: var(--teal);
  background: var(--teal-light);
  display:inline-block;
  padding:3px 9px;
  border-radius: 20px;
  margin-bottom:10px;
}
.quiz__q{
  font-size:1.02rem;
  margin: 0 0 14px;
  color: var(--ink);
  font-weight:600;
}
.quiz__options{ display:grid; gap:8px; margin-bottom:6px; }
.quiz__option{
  text-align:left;
  padding:11px 14px;
  border:1px solid var(--line);
  border-radius: var(--radius-s);
  background: var(--paper);
  cursor:pointer;
  font-size:0.92rem;
  color: var(--ink);
  transition: border-color .15s, background .15s;
}
.quiz__option:hover{ border-color: var(--teal); }
.quiz__option.is-correct{ background: var(--success-bg); border-color: var(--success); font-weight:600; }
.quiz__option.is-wrong{ background: var(--danger-bg); border-color: var(--danger); }
.quiz__option[disabled]{ cursor:default; }

.quiz__tf{ display:flex; gap:10px; }
.quiz__tf .quiz__option{ flex:1; text-align:center; font-weight:600; }

.quiz__match{ display:grid; gap:10px; margin-bottom:10px; }
.quiz__match-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.quiz__match-left{
  min-width:190px;
  font-size:0.9rem;
  padding:9px 12px;
  background: var(--paper);
  border:1px solid var(--line);
  border-radius: var(--radius-s);
}
.quiz__match-select{
  flex:1;
  min-width:180px;
  padding:9px 10px;
  border-radius: var(--radius-s);
  border:1px solid var(--line);
  font-size:0.9rem;
  background:#fff;
}
.quiz__submit{
  margin-top:6px;
  background: var(--ink);
  color:#fff;
  border:none;
  padding:9px 18px;
  border-radius: 20px;
  cursor:pointer;
  font-size:0.86rem;
}
.quiz__submit:hover{ background: var(--ink-soft); }

.quiz__feedback{
  margin-top:12px;
  padding: 11px 14px;
  border-radius: var(--radius-s);
  font-size:0.88rem;
  line-height:1.5;
  display:none;
}
.quiz__feedback.is-visible{ display:block; }
.quiz__feedback.is-correct{ background: var(--success-bg); color:#245239; border:1px solid var(--success); }
.quiz__feedback.is-wrong{ background: var(--danger-bg); color:#7a2d27; border:1px solid var(--danger); }
.quiz__retry{
  margin-top:10px;
  background:none;
  border:1px solid var(--ink);
  color: var(--ink);
  padding:6px 14px;
  border-radius:20px;
  cursor:pointer;
  font-size:0.8rem;
  display:none;
}
.quiz__retry.is-visible{ display:inline-block; }

/* ==========================================================================
   FOOTER NAV
   ========================================================================== */
.chapter-nav{
  max-width:900px;
  margin: 10px 48px 0;
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.navbtn{
  flex:1;
  min-width:220px;
  display:flex;
  flex-direction:column;
  gap:2px;
  padding: 16px 20px;
  border-radius: var(--radius-m);
  border:1px solid var(--line);
  background: var(--paper-2);
  cursor:pointer;
  text-align:left;
  box-shadow: var(--shadow-card);
}
.navbtn:hover{ border-color: var(--gold); }
.navbtn--next{ text-align:right; align-items:flex-end; }
.navbtn__label{ font-family: var(--font-mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:.08em; color: var(--teal); }
.navbtn__title{ font-family: var(--font-display); font-size:1rem; color: var(--ink); }
.navbtn[disabled]{ opacity:0.35; cursor:default; }

/* ==========================================================================
   TITLE / CLOSING PAGES
   ========================================================================== */
.titlepage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at 30% 20%, #1c3a5c, var(--ink) 65%);
  color:#fff;
  text-align:center;
  padding: 40px 24px;
}
.titlepage__inner{ max-width:640px; }
.titlepage__eyebrow{
  font-family: var(--font-mono);
  letter-spacing:.14em;
  text-transform:uppercase;
  color: var(--gold-light);
  font-size:0.8rem;
  margin-bottom:18px;
}
.titlepage__title{
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3.2rem);
  line-height:1.15;
  margin:0 0 14px;
}
.titlepage__subtitle{
  font-size:1.1rem;
  color: var(--gold-light);
  margin:0 0 26px;
}
.titlepage__lead{
  font-size:1rem;
  line-height:1.7;
  color: rgba(255,255,255,0.85);
  margin:0 0 30px;
}
.titlepage__cta{
  display:inline-block;
  background: var(--gold);
  color: var(--ink);
  font-weight:700;
  padding: 13px 30px;
  border-radius:30px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  font-size:0.96rem;
}
.titlepage__cta:hover{ background: var(--gold-light); }

.titlepage__guide--closing{ margin-top: 4px; }
.titlepage__credit{
  font-family: var(--font-mono);
  font-size:0.76rem;
  color: rgba(228,200,147,0.9);
  margin: -4px 0 26px;
}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width: 980px){
  .sidebar{
    transform: translateX(-100%);
    width: 84vw;
    max-width:320px;
  }
  .sidebar.is-open{ transform: translateX(0); box-shadow: var(--shadow-pop); }
  .sidebar__close{ display:block; }
  .main{ margin-left:0; }
  .topbar__menu{ display:inline-block; }
  .hero{ padding: 46px 24px 36px; }
  .content{ padding: 32px 24px 0; }
  .mindmap-wrap, .quiz-wrap, .chapter-nav{ margin-left:24px; margin-right:24px; }
}
@media (max-width: 560px){
  .chapter-nav{ flex-direction:column; }
  .navbtn--next{ text-align:left; align-items:flex-start; }
}

.overlay{
  display:none;
  position:fixed; inset:0;
  background: rgba(16,38,63,0.5);
  z-index:35;
}
.overlay.is-visible{ display:block; }

.skip-link{
  position:absolute; left:-999px; top:0;
  background:#fff; color:var(--ink); padding:10px 16px; z-index:100;
}
.skip-link:focus{ left:10px; top:10px; }

/* ==========================================================================
   MARCA D'ÁGUA — autoria @prigeosc
   Fixa nos cantos da tela em todas as páginas, para identificar a autoria
   do material e dificultar cópias sem crédito.
   ========================================================================== */
.wm{
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  opacity: 0.62;
  filter: drop-shadow(0 1px 4px rgba(0,0,0,0.35));
  user-select:none;
}
.wm img{
  width: 46px;
  height: 46px;
  border-radius: 50%;
  object-fit: cover;
  object-position: 50% 15%;
  border: 2px solid rgba(255,255,255,0.85);
  background:#10263f;
}
.wm span{
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing:.02em;
  color: var(--ink);
  background: rgba(238,241,236,0.82);
  padding: 1px 6px;
  border-radius: 8px;
  white-space:nowrap;
}
.wm--tl{ top:10px; left:10px; }
.wm--tr{ top:10px; right:10px; }
.wm--bl{ bottom:10px; left:10px; }
.wm--br{ bottom:10px; right:10px; }

@media (max-width: 900px){
  .wm img{ width:34px; height:34px; }
  .wm span{ font-size:0.56rem; }
  .wm--tl, .wm--bl{ left:6px; }
  .wm--tr, .wm--br{ right:6px; }
}

</style>

    const total = ROUTES.length;
    const done = ROUTES.filter(r => completed[r]).length;
    const pct = Math.round((done/total)*100);
    progressBar.style.width = pct + "%";
    progressLabel.textContent = done + "/" + total;
  }

  /* ------------------------------------------------------------------ */
  /* Ícone de marca (logo do menu lateral) — sem dependência externa      */
  /* ------------------------------------------------------------------ */
  const ICON_COMPASS_SMALL = `
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="50" cy="50" r="44" stroke="#e4c893" stroke-width="3"/>
      <polygon points="50,16 60,50 50,84 40,50" fill="#e4c893"/>
      <polygon points="16,50 50,42 84,50 50,58" fill="#ffffff" opacity="0.65"/>
    </svg>`;

  /* ------------------------------------------------------------------ */
  /* Utilidades                                                          */
  /* ------------------------------------------------------------------ */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[s]));
  }

  function findChapterIndexById(id){
    return CHAPTERS.findIndex(c => c.id === id);
  }

  function getRouteFromHash(){
    const h = (location.hash || "").replace("#", "");
    return ROUTES.includes(h) ? h : "intro";
  }

  /* ------------------------------------------------------------------ */
  /* TOC (sumário lateral)                                               */
  /* ------------------------------------------------------------------ */
  function renderTOC(){
    const current = getRouteFromHash();
    let html = "";

    html += tocEntry("intro", "Início", "Abertura", current);
    html += `<li class="toc__group-label">Capítulos</li>`;
    CHAPTERS.forEach(c => {
      html += tocEntry(c.id, c.number, c.title, current);
    });
    html += `<li class="toc__group-label">&nbsp;</li>`;
    html += tocEntry("exercicios", "Ex.", "Exercícios ENEM/UFSC", current);
    html += tocEntry("closing", "Fim", "Encerramento", current);

    tocList.innerHTML = html;
  }

  function tocEntry(id, num, label, current){
    const isActive = id === current;
    const isDone = !!completed[id];
    return `
      <li class="toc__item">
        <button class="toc__link ${isActive ? "is-active":""} ${isDone ? "is-done":""}" data-route="${id}">
          <span class="toc__num">${isDone ? "✓" : num}</span>
          <span>${escapeHtml(label)}</span>
        </button>
      </li>`;
  }

  /* ------------------------------------------------------------------ */
  /* Renderização: página de título / encerramento                       */
  /* ------------------------------------------------------------------ */
  function renderTitlePage(data, ctaLabel, ctaRoute){
    const isIntro = data === COURSE.intro;
    const isClosing = data === COURSE.closing;
    view.innerHTML = `
      <section class="titlepage">
        <div class="titlepage__inner">
          ${isIntro ? `
            <div class="titlepage__guide">
              <img src="${PRIGEOSC_AVATAR_SRC}" alt="Prigeosc, guia de geografia do curso" loading="lazy">
              <p class="titlepage__guide-text">Oi! Eu sou a <strong>Prigeosc</strong> e vou te acompanhar pelos 18 capítulos, trazendo notícias e curiosidades atuais em cada um deles!</p>
            </div>` : ""}
          <div class="titlepage__eyebrow">${escapeHtml(data.kicker)}</div>
          <h1 class="titlepage__title">${escapeHtml(data.title)}</h1>
          ${isIntro ? `<p class="titlepage__subtitle">${escapeHtml(COURSE.subtitle)} · ${escapeHtml(COURSE.grade)}</p>` : ""}
          <p class="titlepage__lead">${escapeHtml(data.lead)}</p>
          ${isClosing ? `
            <div class="titlepage__guide titlepage__guide--closing">
              <img src="${PRIGEOSC_AVATAR_SRC}" alt="Prigeosc, autora do material" loading="lazy">
              <p class="titlepage__guide-text">Este material foi elaborado com muito carinho por <strong>@prigeosc</strong>. Muito obrigada por chegar até aqui e por estudar com a gente — bons estudos e até a próxima! 💙</p>
            </div>
            <p class="titlepage__credit">Conteúdo e ilustrações © <strong>@prigeosc</strong> · siga no Instagram <strong>@prigeosc</strong></p>` : ""}
          <button class="titlepage__cta" data-route="${ctaRoute}">${escapeHtml(ctaLabel)}</button>
        </div>
      </section>`;
    view.querySelector("[data-route]").addEventListener("click", (e) => {
      navigate(e.currentTarget.getAttribute("data-route"));
    });
  }

  /* ------------------------------------------------------------------ */
  /* Slot de imagem editável — o professor pode colocar sua própria imagem
     salvando o arquivo com o nome indicado dentro de assets/images/.
     Enquanto o arquivo não existir, mostra um espaço reservado elegante. */
  /* ------------------------------------------------------------------ */
  function imgSlot({ file, alt, label, variant }){
    const cls = "img-slot" + (variant ? " img-slot--" + variant : "");
    return `
      <div class="${cls}">
        <img src="assets/images/${file}" alt="${escapeHtml(alt)}" loading="lazy"
             onload="this.parentElement.classList.add('img-slot--loaded')"
             onerror="this.style.display='none'; this.parentElement.classList.add('img-slot--empty')">
        <div class="img-slot__placeholder">
          <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="8" width="40" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="20" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 32 L18 22 L28 30 L34 24 L44 34" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <p class="img-slot__label">${escapeHtml(label)}</p>
          <p class="img-slot__hint">Salve a imagem como <code>assets/images/${file}</code></p>
        </div>
      </div>`;
  }

  /* ------------------------------------------------------------------ */
  /* Renderização: capítulo                                              */
  /* ------------------------------------------------------------------ */
  function renderChapter(chapter){
    const idx = findChapterIndexById(chapter.id);
    const prev = idx === 0 ? { id:"intro", title:"Início" } : CHAPTERS[idx-1];
    const next = idx === CHAPTERS.length-1 ? { id:"exercicios", title:"Exercícios ENEM/UFSC" } : CHAPTERS[idx+1];

    let sectionsHtml = "";
    chapter.sections.forEach((sec) => {
      sectionsHtml += `
        <div class="section-block">
          <h2 class="section-block__heading">${escapeHtml(sec.heading)}</h2>
          <p class="section-block__body">${escapeHtml(sec.body)}</p>
          ${sec.bullets && sec.bullets.length ? `
            <ul class="card-list">
              ${sec.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}
            </ul>` : ""}
        </div>`;
    });

    const newsHtml = chapter.news ? `
      <section class="prigeosc-box" aria-label="Notícia atual trazida pela Prigeosc">
        <div class="prigeosc-box__avatar">
          <img src="${PRIGEOSC_AVATAR_SRC}" alt="Ilustração da personagem Prigeosc, guia de geografia" loading="lazy">
        </div>
        <div class="prigeosc-box__bubble">
          <p class="prigeosc-box__name">Prigeosc traz a notícia <span class="prigeosc-box__date">· ${escapeHtml(chapter.news.date)}</span></p>
          <p class="prigeosc-box__text">${escapeHtml(chapter.news.text)}</p>
        </div>
      </section>` : "";

    const extraHtml = chapter.extra ? `
      <aside class="extra-box" aria-label="Informações extras do capítulo">
        <p class="extra-box__title">${escapeHtml(chapter.extra.title)}</p>
        <p class="extra-box__text">${escapeHtml(chapter.extra.text)}</p>
      </aside>` : "";

    /* Mapas mentais: por padrão cada capítulo tem 1. Para capítulos que
       precisam de mais de um, defina no objeto do capítulo:
         mindmapCount: 2,
         mindmapLabels: ["Mapa mental — Parte 1", "Mapa mental — Parte 2"]
       (mindmapLabels é opcional; sem ele os mapas ficam "Mapa mental 1", "Mapa mental 2"...)
       Os arquivos esperados serão: capXX-mapa-1.jpg, capXX-mapa-2.jpg, etc.
       Se mindmapCount não for definido (ou for 1), mantém o nome original capXX-mapa.jpg. */
    const mmCount = chapter.mindmapCount && chapter.mindmapCount > 0 ? chapter.mindmapCount : 1;
    let mindmapsHtml = "";
    for (let i = 1; i <= mmCount; i++){
      const mmFile = mmCount === 1 ? chapter.id + "-mapa.jpg" : chapter.id + "-mapa-" + i + ".jpg";
      const mmLabel = (chapter.mindmapLabels && chapter.mindmapLabels[i-1])
        ? chapter.mindmapLabels[i-1]
        : (mmCount === 1 ? "Mapa mental" : "Mapa mental " + i);
      mindmapsHtml += `
      <section class="mindmap-wrap" aria-label="${escapeHtml(mmLabel)} do capítulo">
        <p class="mindmap-wrap__title">${escapeHtml(mmLabel)}</p>
        <p class="mindmap-wrap__hint">Espaço reservado para você inserir sua própria imagem de mapa mental deste capítulo.</p>
        ${imgSlot({
          file: mmFile,
          alt: mmLabel + " do capítulo " + chapter.title,
          label: mmLabel,
          variant: "map"
        })}
      </section>`;
    }

    view.innerHTML = `
      <header class="hero">
        <div class="hero__inner">
          <div class="hero__kicker"><span class="dot"></span> Capítulo ${chapter.number} · ${escapeHtml(chapter.block)}</div>
          <h1 class="hero__title">${escapeHtml(chapter.title)}</h1>
          <p class="hero__lead">${escapeHtml(chapter.lead)}</p>
        </div>
        <div class="hero__capa">
          ${imgSlot({
            file: chapter.id + "-capa.jpg",
            alt: "Imagem representando o capítulo " + chapter.title,
            label: "Imagem do capítulo",
            variant: "hero"
          })}
        </div>
      </header>

      <div class="content">
        ${newsHtml}
        ${sectionsHtml}
        ${extraHtml}
      </div>

      ${mindmapsHtml}

      <details class="quiz-wrap" aria-label="Exercícios de revisão">
        <summary class="quiz-wrap__summary">
          <span class="quiz-wrap__summary-title">Revisão rápida — exercícios deste capítulo</span>
          <span class="quiz-wrap__summary-hint">Toque para abrir, se quiser usar em sala</span>
        </summary>
        <div class="quiz-wrap__body">
          <div id="quizContainer"></div>
        </div>
      </details>

      <nav class="chapter-nav" aria-label="Navegação entre capítulos">
        <button class="navbtn navbtn--prev" data-route="${prev.id}">
          <span class="navbtn__label">← Anterior</span>
          <span class="navbtn__title">${escapeHtml(prev.title)}</span>
        </button>
        <button class="navbtn navbtn--next" data-route="${next.id}" id="nextBtn">
          <span class="navbtn__label">Próximo →</span>
          <span class="navbtn__title">${escapeHtml(next.title)}</span>
        </button>
      </nav>
    `;

    // Quiz (construído mas mantido fechado dentro do <details>)
    renderQuiz(chapter);

    // Nav buttons
    view.querySelectorAll(".navbtn").forEach(btn => {
      btn.addEventListener("click", () => navigate(btn.getAttribute("data-route")));
    });

    markComplete(chapter.id);
  }

  /* ------------------------------------------------------------------ */
  /* Página "Exercícios ENEM/UFSC" — 5 questões por capítulo             */
  /* ------------------------------------------------------------------ */
  function renderExercisesPage(){
    const lastChapter = CHAPTERS[CHAPTERS.length - 1];

    let sectionsHtml = "";
    EXERCISES.forEach((ex, idx) => {
      const containerId = "exqz-" + ex.chapterId;
      sectionsHtml += `
      <details class="quiz-wrap" aria-label="Exercícios do capítulo ${idx+1}">
        <summary class="quiz-wrap__summary">
          <span class="quiz-wrap__summary-title">Capítulo ${idx+1} — ${escapeHtml(ex.chapterTitle)}</span>
          <span class="quiz-wrap__summary-hint">5 questões estilo ENEM/UFSC · toque para abrir</span>
        </summary>
        <div class="quiz-wrap__body">
          <div id="${containerId}"></div>
        </div>
      </details>`;
    });

    view.innerHTML = `
      <header class="hero">
        <div class="hero__inner">
          <div class="hero__kicker"><span class="dot"></span> Revisão final</div>
          <h1 class="hero__title">Exercícios — Estilo ENEM e UFSC</h1>
          <p class="hero__lead">Um banco de 5 questões de múltipla escolha por capítulo, no formato usado em provas como o ENEM e a UFSC, para revisar todo o conteúdo do curso. Toque no título de cada capítulo para abrir as questões.</p>
        </div>
      </header>
      <div class="content">
        ${sectionsHtml}
      </div>
      <nav class="chapter-nav" aria-label="Navegação">
        <button class="navbtn navbtn--prev" data-route="${lastChapter.id}">
          <span class="navbtn__label">← Anterior</span>
          <span class="navbtn__title">${escapeHtml(lastChapter.title)}</span>
        </button>
        <button class="navbtn navbtn--next" data-route="closing">
          <span class="navbtn__label">Próximo →</span>
          <span class="navbtn__title">Encerramento</span>
        </button>
      </nav>
    `;

    EXERCISES.forEach(ex => {
      const container = document.getElementById("exqz-" + ex.chapterId);
      container.innerHTML = "";
      ex.items.forEach((item, i) => {
        const box = document.createElement("div");
        box.className = "quiz";
        box.innerHTML = `
          <span class="quiz__type">Múltipla escolha</span>
          <p class="quiz__q">${i+1}. ${escapeHtml(item.q)}</p>
          <div class="quiz__body"></div>
          <div class="quiz__feedback" role="status"></div>
          <button class="quiz__retry" type="button">Tentar novamente</button>
        `;
        container.appendChild(box);

        const body = box.querySelector(".quiz__body");
        const feedback = box.querySelector(".quiz__feedback");
        const retry = box.querySelector(".quiz__retry");
        renderMC(item, body, feedback, retry);
      });
    });

    view.querySelectorAll(".navbtn").forEach(btn => {
      btn.addEventListener("click", () => navigate(btn.getAttribute("data-route")));
    });

    markComplete("exercicios");
  }

  /* ------------------------------------------------------------------ */
  /* Exercícios                                                          */
  /* ------------------------------------------------------------------ */
  function renderQuiz(chapter){
    const container = document.getElementById("quizContainer");
    container.innerHTML = "";
    chapter.quiz.forEach((item, i) => {
      const box = document.createElement("div");
      box.className = "quiz";
      const typeLabel = item.type === "mc" ? "Múltipla escolha" : item.type === "tf" ? "Verdadeiro ou falso" : "Associação de conceitos";
      box.innerHTML = `
        <span class="quiz__type">${typeLabel}</span>
        <p class="quiz__q">${i+1}. ${escapeHtml(item.q)}</p>
        <div class="quiz__body"></div>
        <div class="quiz__feedback" role="status"></div>
        <button class="quiz__retry" type="button">Tentar novamente</button>
      `;
      container.appendChild(box);

      const body = box.querySelector(".quiz__body");
      const feedback = box.querySelector(".quiz__feedback");
      const retry = box.querySelector(".quiz__retry");

      if (item.type === "mc"){
        renderMC(item, body, feedback, retry);
      } else if (item.type === "tf"){
        renderTF(item, body, feedback, retry);
      } else if (item.type === "match"){
        renderMatch(item, body, feedback, retry);
      }
    });
  }

  function showFeedback(feedbackEl, retryEl, isCorrect, explain){
    feedbackEl.textContent = (isCorrect ? "✓ Correto! " : "✗ Quase lá. ") + explain;
    feedbackEl.className = "quiz__feedback is-visible " + (isCorrect ? "is-correct" : "is-wrong");
    retryEl.classList.add("is-visible");
  }

  function renderMC(item, body, feedback, retry){
    function draw(){
      body.innerHTML = `<div class="quiz__options"></div>`;
      const optWrap = body.querySelector(".quiz__options");
      item.options.forEach((opt, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "quiz__option";
        b.textContent = opt;
        b.addEventListener("click", () => {
          const correct = i === item.correct;
          optWrap.querySelectorAll("button").forEach(x => x.disabled = true);
          b.classList.add(correct ? "is-correct" : "is-wrong");
          if (!correct){
            optWrap.children[item.correct].classList.add("is-correct");
          }
          showFeedback(feedback, retry, correct, item.explain);
        });
        optWrap.appendChild(b);
      });
      feedback.className = "quiz__feedback";
      retry.classList.remove("is-visible");
    }
    draw();
    retry.addEventListener("click", draw);
  }

  function renderTF(item, body, feedback, retry){
    function draw(){
      body.innerHTML = `
        <div class="quiz__tf">
          <button type="button" class="quiz__option" data-val="true">Verdadeiro</button>
          <button type="button" class="quiz__option" data-val="false">Falso</button>
        </div>`;
      const btns = body.querySelectorAll(".quiz__option");
      btns.forEach(b => {
        b.addEventListener("click", () => {
          const val = b.getAttribute("data-val") === "true";
          const correct = val === item.correct;
          btns.forEach(x => x.disabled = true);
          b.classList.add(correct ? "is-correct" : "is-wrong");
          if (!correct){
            btns.forEach(x => { if ((x.getAttribute("data-val") === "true") === item.correct) x.classList.add("is-correct"); });
          }
          showFeedback(feedback, retry, correct, item.explain);
        });
      });
      feedback.className = "quiz__feedback";
      retry.classList.remove("is-visible");
    }
    draw();
    retry.addEventListener("click", draw);
  }

  function renderMatch(item, body, feedback, retry){
    function draw(){
      const rightOptions = item.pairs.map(p => p.right);
      const shuffled = [...rightOptions].sort(() => Math.random() - 0.5);

      body.innerHTML = `<div class="quiz__match"></div><button type="button" class="quiz__submit">Corrigir</button>`;
      const matchWrap = body.querySelector(".quiz__match");

      item.pairs.forEach((pair, i) => {
        const row = document.createElement("div");
        row.className = "quiz__match-row";
        row.innerHTML = `
          <span class="quiz__match-left">${escapeHtml(pair.left)}</span>
          <select class="quiz__match-select" data-index="${i}">
            <option value="">Selecione a associação…</option>
            ${shuffled.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join("")}
          </select>
        `;
        matchWrap.appendChild(row);
      });

      const submitBtn = body.querySelector(".quiz__submit");
      submitBtn.addEventListener("click", () => {
        const selects = matchWrap.querySelectorAll("select");
        let allCorrect = true;
        let allAnswered = true;
        selects.forEach((sel, i) => {
          if (!sel.value){ allAnswered = false; return; }
          const correctRight = item.pairs[i].right;
          if (sel.value === correctRight){
            sel.style.borderColor = "var(--success)";
          } else {
            sel.style.borderColor = "var(--danger)";
            allCorrect = false;
          }
        });
        if (!allAnswered){
          feedback.textContent = "Associe todos os itens antes de corrigir.";
          feedback.className = "quiz__feedback is-visible is-wrong";
          return;
        }
        selects.forEach(sel => sel.disabled = true);
        submitBtn.disabled = true;
        showFeedback(feedback, retry, allCorrect, item.explain);
      });

      feedback.className = "quiz__feedback";
      retry.classList.remove("is-visible");
    }
    draw();
    retry.addEventListener("click", draw);
  }

  /* ------------------------------------------------------------------ */
  /* Roteamento                                                          */
  /* ------------------------------------------------------------------ */
  function navigate(route){
    if (!ROUTES.includes(route)) route = "intro";
    location.hash = route;
  }

  function render(){
    const route = getRouteFromHash();
    closeSidebar();
    renderTOC();
    updateProgressUI();

    if (route === "intro"){
      renderTitlePage(COURSE.intro, "Começar o curso →", CHAPTERS[0].id);
    } else if (route === "exercicios"){
      renderExercisesPage();
    } else if (route === "closing"){
      markComplete("closing");
      renderTitlePage(COURSE.closing, "Revisar o índice", "intro");
    } else {
      const chapter = CHAPTERS.find(c => c.id === route);
      if (chapter){
        renderChapter(chapter);
      } else {
        renderTitlePage(COURSE.intro, "Começar o curso →", CHAPTERS[0].id);
      }
    }
    window.scrollTo({ top:0, behavior: "auto" });
  }

  /* ------------------------------------------------------------------ */
  /* Sidebar (mobile)                                                    */
  /* ------------------------------------------------------------------ */
  function openSidebar(){
    sidebar.classList.add("is-open");
    overlay.classList.add("is-visible");
  }
  function closeSidebar(){
    sidebar.classList.remove("is-open");
    overlay.classList.remove("is-visible");
  }

  document.getElementById("menuBtn").addEventListener("click", openSidebar);
  document.getElementById("closeSidebarBtn").addEventListener("click", closeSidebar);
  overlay.addEventListener("click", closeSidebar);

  tocList.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-route]");
    if (btn) navigate(btn.getAttribute("data-route"));
  });

  window.addEventListener("hashchange", render);

  /* ------------------------------------------------------------------ */
  /* Lightbox — ampliar a imagem do mapa mental ao clicar               */
  /* ------------------------------------------------------------------ */
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxScroll = document.getElementById("lightboxScroll");
  const lightboxClose = document.getElementById("lightboxClose");

  function openLightbox(src, alt){
    lightboxImg.src = src;
    lightboxImg.alt = alt || "";
    lightboxImg.classList.remove("is-zoomed");
    lightboxScroll.classList.remove("is-zoomed");
    lightbox.classList.add("is-visible");
  }
  function closeLightbox(){
    lightbox.classList.remove("is-visible");
    lightboxImg.classList.remove("is-zoomed");
    lightboxScroll.classList.remove("is-zoomed");
    lightboxImg.removeAttribute("src");
  }

  // Delegação: qualquer imagem já carregada dentro de um slot "mapa" abre o lightbox
  document.addEventListener("click", (e) => {
    const img = e.target.closest(".img-slot--map.img-slot--loaded img");
    if (img){ openLightbox(img.src, img.alt); return; }
  });

  // Dentro do lightbox, clicar na imagem alterna entre ajustada e tamanho real (zoom).
  // No modo ampliado, o contêiner passa a layout em bloco (sem centralização por
  // flexbox), o que permite rolar livremente em qualquer direção — inclusive
  // para a esquerda e para cima, algo que a centralização via flex impede.
  lightboxImg.addEventListener("click", () => {
    const zoomingIn = !lightboxImg.classList.contains("is-zoomed");
    lightboxImg.classList.toggle("is-zoomed", zoomingIn);
    lightboxScroll.classList.toggle("is-zoomed", zoomingIn);
    if (zoomingIn){
      // Após o navegador recalcular o layout, centraliza a rolagem inicial
      // no meio da imagem, para que o usuário possa navegar em qualquer sentido.
      requestAnimationFrame(() => {
        lightboxScroll.scrollLeft = (lightboxImg.scrollWidth - lightboxScroll.clientWidth) / 2;
        lightboxScroll.scrollTop = (lightboxImg.scrollHeight - lightboxScroll.clientHeight) / 2;
      });
    }
  });

  lightboxClose.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lightbox.classList.contains("is-visible")) closeLightbox();
  });

  /* ------------------------------------------------------------------ */
  /* Init                                                                */
  /* ------------------------------------------------------------------ */
  document.getElementById("brandTitle").textContent = COURSE.title;
  document.getElementById("brandSubtitle").textContent = COURSE.subtitle;
  document.getElementById("brandCompass").innerHTML = ICON_COMPASS_SMALL;
  document.title = COURSE.title + " — " + COURSE.grade;

  render();

})();

</script>
</body>
</html>
